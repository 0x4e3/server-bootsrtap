---
exclude: ^group_vars/vault\.ya?ml$

repos:
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commit message
        entry: uv run bash scripts/check-commit-message
        language: system
        stages:
          - commit-msg
      - id: ansible-syntax
        name: Ansible syntax check
        entry: uv run bash scripts/check-ansible-syntax
        language: system
        pass_filenames: false
        files: >-
          ^(ansible\.cfg|inventories/|group_vars/|host_vars/|playbooks/|roles/)
      - id: bootstrap-integration
        name: Bootstrap lightweight test
        entry: just test-bootstrap-lightweight
        language: system
        pass_filenames: false
        files: >-
          ^(Justfile|ansible\.cfg|inventories/|group_vars/|host_vars/|playbooks/|pyproject\.toml|roles/|tests/bootstrap/|uv\.lock)
      - id: setup-lightweight
        name: Setup lightweight test
        entry: just test-setup-lightweight
        language: system
        pass_filenames: false
        files: >-
          ^(Justfile|group_vars/all\.yaml|roles/(docker|iptables_firewall|ssh_hardening|traefik)/|tests/setup/(lightweight\.sh|render\.yaml))
