---
- name: Ensure OpenSSH server is installed
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: Ensure sshd drop-in directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure SSH socket override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/ssh.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure SSH socket listen port
  ansible.builtin.copy:
    dest: /etc/systemd/system/ssh.socket.d/addresses.conf
    content: |
      [Socket]
      ListenStream=
      ListenStream=0.0.0.0:{{ ssh_hardening_port }}
    owner: root
    group: root
    mode: "0644"
  notify: validate and restart ssh

- name: Deploy hardened sshd_config drop-in
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/00-ansible-hardening.conf
    owner: root
    group: root
    mode: "0600"
    backup: true
    validate: "/usr/sbin/sshd -t -f %s"
  notify: validate and restart ssh

- name: Ensure SSH socket is enabled
  ansible.builtin.systemd_service:
    name: ssh.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so SSH socket is restarted before continuing
  ansible.builtin.meta: flush_handlers

- name: Use configured SSH port for subsequent tasks
  ansible.builtin.set_fact:
    ansible_port: "{{ ssh_hardening_port }}"

- name: Reset connection after switching SSH port
  ansible.builtin.meta: reset_connection

- name: Wait for SSH authentication on the configured port
  ansible.builtin.wait_for_connection:
    timeout: 60
    delay: 3
