---
- name: Validate Docker target platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == 'Ubuntu'
    fail_msg: "The docker role supports Ubuntu only."

- name: Ensure Docker repository prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-debian
    state: present
    update_cache: true

- name: Ensure Docker APT keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Docker APT signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_key
  until: docker_apt_key is succeeded
  retries: 3
  delay: 2

- name: Configure Docker APT repository
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ docker_apt_architecture }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
  register: docker_apt_repository

- name: Update apt cache after Docker repository changes
  ansible.builtin.command: apt-get update
  changed_when: false
  when: docker_apt_repository.changed

- name: Install Docker Engine, Buildx, and Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Ensure Docker daemon configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: "dockerd --validate --config-file %s"
  notify: restart docker

- name: Ensure Docker service is enabled and started
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Recreate Docker iptables chains after firewall changes
  ansible.builtin.systemd_service:
    name: docker
    state: restarted
  when: iptables_firewall_rules_changed | default(false) | bool

- name: Grant Docker access to configured users
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Apply Docker daemon configuration
  ansible.builtin.meta: flush_handlers

- name: Reset connection to apply Docker group membership
  ansible.builtin.meta: reset_connection
